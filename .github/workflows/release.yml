name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --onefile --uac-admin --name pydpi --collect-all pydivert main.py
      - run: dist\pydpi.exe --version
      - name: SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\pydpi.exe -Algorithm SHA256).Hash.ToLower()
          "$h  pydpi.exe" | Out-File -Encoding ascii dist\pydpi.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pydpi-exe
          path: dist/pydpi.exe*
      - name: Release olustur
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pydpi.exe
            dist/pydpi.exe.sha256
          generate_release_notes: true
